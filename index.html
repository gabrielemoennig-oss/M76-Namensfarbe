    // sRGB (0-255) -> CIELAB. D65 für den RAL-Abgleich (Seheindruck), D50 zusätzlich zur Anzeige
    // (Standard-Lichtart für ICC-Profile, Druck und Lack).
    const LAB_SETUP = {
        D65: {
            m: [[0.4124564, 0.3575761, 0.1804375], [0.2126729, 0.7151522, 0.0721750], [0.0193339, 0.1191920, 0.9503041]],
            w: [0.95047, 1.0, 1.08883]
        },
        D50: {
            m: [[0.4360747, 0.3850649, 0.1430804], [0.2225045, 0.7168786, 0.0606169], [0.0139322, 0.0971045, 0.7141733]],
            w: [0.96422, 1.0, 0.82521]
        }
    };

    function rgbToLab(r, g, b, illuminant = 'D65') {
        const { m, w } = LAB_SETUP[illuminant];
        const lin = c => {
            c /= 255;
            return c <= 0.04045 ? c / 12.92 : Math.pow((c + 0.055) / 1.055, 2.4);
        };
        const R = lin(r), G = lin(g), B = lin(b);
        const f = t => t > 0.008856 ? Math.cbrt(t) : (7.787 * t) + 16 / 116;
        const x = f((m[0][0] * R + m[0][1] * G + m[0][2] * B) / w[0]);
        const y = f((m[1][0] * R + m[1][1] * G + m[1][2] * B) / w[1]);
        const z = f((m[2][0] * R + m[2][1] * G + m[2][2] * B) / w[2]);
        return [116 * y - 16, 500 * (x - y), 200 * (y - z)];
    }

    function formatLab(lab) {
        // + 0 verhindert die Anzeige von "-0.0"
        const v = lab.map(x => (Math.round(x * 10) / 10 + 0).toFixed(1));
        return 'L ' + v[0] + ' · a ' + v[1] + ' · b ' + v[2];
    }

    function hexToRgb(hex) {
        const h = hex.replace('#', '');
        return [parseInt(h.slice(0, 2), 16), parseInt(h.slice(2, 4), 16), parseInt(h.slice(4, 6), 16)];
    }

    const RAL = RAL_DATA.map(entry => {
        const [code, name, hex] = entry.split('|');
        return { code, name, hex: '#' + hex, lab: rgbToLab(...hexToRgb(hex)) };
    });

    function nearestRal(hex) {
        const lab = rgbToLab(...hexToRgb(hex));
        let best = null;
        let bestDist = Infinity;
        for (const ral of RAL) {
            const dL = lab[0] - ral.lab[0];
            const dA = lab[1] - ral.lab[1];
            const dB = lab[2] - ral.lab[2];
            const dist = dL * dL + dA * dA + dB * dB;
            if (dist < bestDist) {
                bestDist = dist;
                best = ral;
            }
        }
        return best;
    }

    // Identität = exakte Schreibweise.
    // Groß-/Kleinschreibung, Umlaute, ß, Akzente und innere Leerzeichen zählen mit.
    // Es wird nur getrimmt (Leerzeichen am Rand) und NFC-normalisiert
    // (dieselbe Schreibweise ergibt auf jedem Gerät dieselbe Kodierung).
    async function textToHexColor(text) {
        if (!text || text.trim() === '') {
            return DEFAULT_HEX;
        }

        const cleanText = text.trim().normalize('NFC');

        const msgBuffer = new TextEncoder().encode(cleanText);
        const hashBuffer = await crypto.subtle.digest('SHA-256', msgBuffer);
        const hashArray = Array.from(new Uint8Array(hashBuffer));

        // Deterministische Extraktion der ersten 3 Bytes der SHA-256-Prüfsumme
        const [r, g, b] = hashArray;

        return "#" + [r, g, b]
            .map(x => x.toString(16).padStart(2, '0'))
            .join('')
            .toUpperCase();
    }

    const input = document.getElementById('wordInput');
    const preview = document.getElementById('colorPreview');
    const output = document.getElementById('hexOutput');
    const ralOutput = document.getElementById('ralOutput');
    const ralSwatch = document.getElementById('ralSwatch');
    const ralHex = document.getElementById('ralHex');
    const copyBtn = document.getElementById('copyBtn');
    const note = document.getElementById('note');
    const labD50 = document.getElementById('labD50');
    const labD65 = document.getElementById('labD65');

    // crypto.subtle gibt es nur in sicheren Kontexten (HTTPS oder localhost)
    const cryptoAvailable = !!(window.crypto && window.crypto.subtle);
    if (!cryptoAvailable) {
        note.textContent = 'Nicht verfügbar: Die Seite muss über HTTPS oder localhost geöffnet werden.';
        input.disabled = true;
    }

    // Zähler, damit ein älteres Ergebnis kein neueres überschreibt
    let requestId = 0;

    input.addEventListener('input', async (e) => {
        const myId = ++requestId;
        const hasText = e.target.value.trim() !== '';
        const hexColor = await textToHexColor(e.target.value);
        if (myId !== requestId) return;

        preview.style.backgroundColor = hexColor;
        output.textContent = hexColor;

        if (hasText) {
            const ral = nearestRal(hexColor);
            ralOutput.textContent = 'RAL ' + ral.code + ' ' + ral.name;
            ralSwatch.style.backgroundColor = ral.hex;
            ralHex.textContent = ral.hex;
            const rgb = hexToRgb(hexColor);
            labD50.textContent = formatLab(rgbToLab(...rgb, 'D50'));
            labD65.textContent = formatLab(rgbToLab(...rgb, 'D65'));
        } else {
            ralOutput.textContent = '–';
            ralSwatch.style.backgroundColor = '#333333';
            ralHex.textContent = '';
            labD50.textContent = '–';
            labD65.textContent = '–';
        }
    });

    copyBtn.addEventListener('click', async () => {
        const originalText = copyBtn.textContent;
        const hasValue = ralOutput.textContent !== '–';
        const ralText = hasValue ? ' / ' + ralOutput.textContent + ' / Lab(D50) ' + labD50.textContent : '';
        let label;
        try {
            await navigator.clipboard.writeText(output.textContent + ralText);
            label = 'Kopiert!';
        } catch (err) {
            label = 'Fehlgeschlagen';
        }
        copyBtn.textContent = label;
        setTimeout(() => { copyBtn.textContent = originalText; }, 1500);
    });
