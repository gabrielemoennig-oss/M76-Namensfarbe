    const LAB_SETUP = {
        D65: {
            m: [[0.4124564, 0.3575761, 0.1804375], [0.2126729, 0.7151522, 0.0721750], [0.0193339, 0.1191920, 0.9503041]],
            w: [0.95047, 1.0, 1.08883]
        },
        D50: {
            m: [[0.4360747, 0.3850649, 0.1430804], [0.2225045, 0.7168786, 0.0606169], [0.0139322, 0.0971045, 0.7141733]],
            w: [0.96422, 1.0, 0.82521]
        }
    };

    function rgbToLab(r, g, b, illuminant = 'D65') {
        const { m, w } = LAB_SETUP[illuminant];
        const lin = c => {
            c /= 255;
            return c <= 0.04045 ? c / 12.92 : Math.pow((c + 0.055) / 1.055, 2.4);
        };
        const R = lin(r), G = lin(g), B = lin(b);
        const f = t => t > 0.008856 ? Math.cbrt(t) : (7.787 * t) + 16 / 116;
        const x = f((m[0][0] * R + m[0][1] * G + m[0][2] * B) / w[0]);
        const y = f((m[1][0] * R + m[1][1] * G + m[1][2] * B) / w[1]);
        const z = f((m[2][0] * R + m[2][1] * G + m[2][2] * B) / w[2]);
        return [116 * y - 16, 500 * (x - y), 200 * (y - z)];
    }

    function relativeLuminance(rgb) {
        const [R, G, B] = rgb.map(c => {
            c /= 255;
            return c <= 0.04045 ? c / 12.92 : Math.pow((c + 0.055) / 1.055, 2.4);
        });
        return 0.2126 * R + 0.7152 * G + 0.0722 * B;
    }

    function contrastText(ratio) {
        let tag;
        if (ratio >= 7) tag = 'AAA';
        else if (ratio >= 4.5) tag = 'AA';
        else if (ratio >= 3) tag = 'nur große Schrift';
        else tag = 'zu niedrig';
        return ratio.toFixed(1) + ' : 1 (' + tag + ')';
    }

    function formatLab(lab) {
        const v = lab.map(x => (Math.round(x * 10) / 10 + 0).toFixed(1));
        return 'L ' + v[0] + ' · a ' + v[1] + ' · b ' + v[2];
    }

    function hexToRgb(hex) {
        const h = hex.replace('#', '');
        return [parseInt(h.slice(0, 2), 16), parseInt(h.slice(2, 4), 16), parseInt(h.slice(4, 6), 16)];
    }

    const RAL = RAL_DATA.map(entry => {
        const [code, name, hex] = entry.split('|');
        return { code, name, hex: '#' + hex, lab: rgbToLab(...hexToRgb(hex)) };
    });

    function nearestRal(hex) {
        const lab = rgbToLab(...hexToRgb(hex));
        let best = null;
        let bestDist = Infinity;
        for (const ral of RAL) {
            const dL = lab[0] - ral.lab[0];
            const dA = lab[1] - ral.lab[1];
            const dB = lab[2] - ral.lab[2];
            const dist = dL * dL + dA * dA + dB * dB;
            if (dist < bestDist) {
                bestDist = dist;
                best = ral;
            }
        }
        return best;
    }

    async function textToHexColor(text) {
        if (!text || text.trim() === '') return DEFAULT_HEX;
        const cleanText = text.trim().normalize('NFC');
        const msgBuffer = new TextEncoder().encode(cleanText);
        const hashBuffer = await crypto.subtle.digest('SHA-256', msgBuffer);
        const hashArray = Array.from(new Uint8Array(hashBuffer));
        const [r, g, b] = hashArray;
        return "#" + [r, g, b].map(x => x.toString(16).padStart(2, '0')).join('').toUpperCase();
    }

    // Verbesserter, strukturierter Prompt-Generator ohne Midjourney-Füllwörter & mit Farb-Hierarchien
    function generateSystemicPrompt(results) {
        const validResults = results.filter(r => r.text !== '');
        if (validResults.length === 0) return '–';

        const primary = validResults[0];
        const others = validResults.slice(1);

        let desc = `A professional corporate and editorial design concept based on a custom mathematical identity palette. ` +
                   `The primary dominant base tone is inspired by '${primary.text}' (Hex ${primary.hex}, similar to ${primary.ral.name}), dominating large background surfaces and textiles. `;
        
        if (others.length > 0) {
            const secondaryList = others.map((o, idx) => `Accent ${idx + 1} for '${o.text}' (Hex ${o.hex}, similar to ${o.ral.name})`).join(', ');
            desc += `Secondary structural elements and highlights use: ${secondaryList}. `;
        }

        desc += `The visual output must show a clean grid containing 3 distinct scenes: ` +
                `1. A minimalist web interface layout on a laptop screen with calm typography and structured color accents. ` +
                `2. An architectural interior design view of an executive workspace featuring calm neutral walls, structured textiles, and targeted color accents. ` +
                `3. A person wearing a timeless, elegant professional outfit aligned with the palette. ` +
                `Style: Editorial architecture photography, natural daylight, matte textures, high-end corporate identity presentation, clean composition.`;
        return desc;
    }

        for (let input of inputs) {
            const val = input.value;
            const hex = await textToHexColor(val);
            const ral = nearestRal(hex);
            results.push({ text: val.trim(), hex, ral });
        }

        if (myId !== requestId) return;

        // Palette-Streifen unten aktualisieren
        palettePreview.innerHTML = '';
        results.forEach(res => {
            const swatch = document.createElement('div');
            swatch.className = 'palette-swatch';
            swatch.style.backgroundColor = res.hex;
            swatch.title = res.text ? `${res.text}: ${res.hex}` : res.hex;
            palettePreview.appendChild(swatch);
        });

        // Primärwert (erstes Eingabefeld) für das Haupt-Vorschauquadrat und die Details
        const primary = results[0];
        colorPreview.style.backgroundColor = primary.hex;
        hexOutput.textContent = primary.hex;

        if (primary.text !== '') {
            const rgb = hexToRgb(primary.hex);
            rgbOutput.textContent = 'rgb(' + rgb.join(', ') + ')';
            ralOutput.textContent = 'RAL ' + primary.ral.code + ' ' + primary.ral.name;
            ralSwatch.style.backgroundColor = primary.ral.hex;
            ralHex.textContent = primary.ral.hex;
            labD50.textContent = formatLab(rgbToLab(...rgb, 'D50'));
            labD65.textContent = formatLab(rgbToLab(...rgb, 'D65'));
            
            const lum = relativeLuminance(rgb);
            const hbwVal = Math.round(lum * 100);
            contrastWhite.textContent = contrastText(1.05 / (lum + 0.05));
            contrastBlack.textContent = contrastText((lum + 0.05) / 0.05);
            hbwOutput.textContent = hbwVal + ' von 100';

            promptOutput.textContent = generateSystemicPrompt(results);
        } else {
            rgbOutput.textContent = '';
            ralOutput.textContent = '–';
            ralSwatch.style.backgroundColor = '#333333';
            ralHex.textContent = '';
            labD50.textContent = '–';
            labD65.textContent = '–';
            contrastWhite.textContent = '–';
            contrastBlack.textContent = '–';
            hbwOutput.textContent = '–';
            promptOutput.textContent = '–';
        }
    }

    function addInputField(value = '') {
        const group = document.createElement('div');
        group.className = 'input-group';
        group.innerHTML = `
            <input type="text" class="name-input" placeholder="Weiterer Begriff (z.B. Nachname)..." value="${value}" autocomplete="off">
            <button class="remove-btn" type="button">×</button>
        `;
        
        const input = group.querySelector('input');
        const removeBtn = group.querySelector('.remove-btn');

        input.addEventListener('input', processPalette);
        removeBtn.addEventListener('click', () => {
            group.remove();
            updateRemoveButtons();
            processPalette();
        });

        inputsContainer.appendChild(group);
        updateRemoveButtons();
        input.focus();
    }

    const initialInput = inputsContainer.querySelector('.name-input');
    initialInput.addEventListener('input', processPalette);

    addInputBtn.addEventListener('click', () => {
        addInputField();
    });

    copyBtn.addEventListener('click', async () => {
        const originalText = copyBtn.textContent;
        const ralText = ralOutput.textContent !== '–' ? ' / ' + ralOutput.textContent + ' / Lab(D50) ' + labD50.textContent : '';
        try {
            await navigator.clipboard.writeText(hexOutput.textContent + ralText);
            copyBtn.textContent = 'Kopiert!';
        } catch (err) {
            copyBtn.textContent = 'Fehlgeschlagen';
        }
        setTimeout(() => { copyBtn.textContent = originalText; }, 1500);
    });

    copyPromptBtn.addEventListener('click', async () => {
        const originalText = copyPromptBtn.textContent;
        if (promptOutput.textContent === '–') return;
        try {
            await navigator.clipboard.writeText(promptOutput.textContent);
            copyPromptBtn.textContent = 'Kopiert!';
        } catch (err) {
            copyPromptBtn.textContent = 'Fehlgeschlagen';
        }
        setTimeout(() => { copyPromptBtn.textContent = originalText; }, 1500);
    });
</script>

</body>
</html>
