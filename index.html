<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>mönch76 | digitaler spiegel</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: #1a1a1a;
            color: #e0e0e0;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            padding: 20px;
            box-sizing: border-box;
        }
        .container {
            background-color: #242424;
            padding: 30px;
            border-radius: 8px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.5);
            max-width: 450px;
            width: 100%;
            text-align: center;
        }
        h1 {
            font-size: 24px;
            font-weight: 300;
            letter-spacing: 1px;
            margin-bottom: 5px;
            color: #ffffff;
        }
        .subtitle {
            font-size: 11px;
            color: #888888;
            margin-bottom: 25px;
            text-transform: uppercase;
            letter-spacing: 2px;
        }
        input[type="text"] {
            width: 100%;
            padding: 12px;
            background-color: #1a1a1a;
            border: 1px solid #333333;
            border-radius: 4px;
            color: #ffffff;
            font-size: 16px;
            box-sizing: border-box;
            text-align: center;
            margin-bottom: 20px;
        }
        input[type="text"]:focus {
            outline: none;
            border-color: #555555;
        }
        .color-preview {
            width: 100%;
            height: 8px;
            border-radius: 2px;
            margin-bottom: 25px;
            transition: background-color 0.15s ease;
            background-color: #333333;
        }
        .result-box {
            font-family: monospace;
            font-size: 14px;
            background-color: #1a1a1a;
            padding: 12px;
            border-radius: 4px;
            border: 1px solid #333333;
            color: #aaaaaa;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .hex-value {
            color: #ffffff;
            font-weight: bold;
        }
        .copy-btn {
            background: none;
            border: 1px solid #444444;
            color: #888888;
            padding: 4px 8px;
            font-size: 11px;
            border-radius: 3px;
            cursor: pointer;
            transition: all 0.2s;
        }
        .copy-btn:hover {
            border-color: #666666;
            color: #ffffff;
        }
        .note {
            margin-top: 15px;
            font-size: 11px;
            color: #888888;
            min-height: 14px;
        }
    </style>
</head>
<body>

<div class="container">
    <h1>mönch76</h1>
    <div class="subtitle">digitaler spiegel // stimmen.me</div>

    <input type="text" id="wordInput" placeholder="Begriff oder Satz eingeben..." autocomplete="off" aria-label="Begriff oder Satz eingeben">

    <div class="color-preview" id="colorPreview"></div>

    <div class="result-box">
        <span>Matrikel-Farbwert: <span class="hex-value" id="hexOutput" aria-live="polite">#333333</span></span>
        <button class="copy-btn" id="copyBtn" type="button">Kopieren</button>
    </div>

    <div class="note" id="note" role="status"></div>
</div>

<script>
    const DEFAULT_HEX = '#333333';

    // Identität = exakte Schreibweise.
    // Groß-/Kleinschreibung, Umlaute, ß, Akzente und innere Leerzeichen zählen mit.
    // Es wird nur getrimmt (Leerzeichen am Rand) und NFC-normalisiert
    // (dieselbe Schreibweise ergibt auf jedem Gerät dieselbe Kodierung).
    async function textToHexColor(text) {
        if (!text || text.trim() === '') {
            return DEFAULT_HEX;
        }

        const cleanText = text.trim().normalize('NFC');

        const msgBuffer = new TextEncoder().encode(cleanText);
        const hashBuffer = await crypto.subtle.digest('SHA-256', msgBuffer);
        const hashArray = Array.from(new Uint8Array(hashBuffer));

        // Deterministische Extraktion der ersten 3 Bytes der SHA-256-Prüfsumme
        const [r, g, b] = hashArray;

        return "#" + [r, g, b]
            .map(x => x.toString(16).padStart(2, '0'))
            .join('')
            .toUpperCase();
    }

    const input = document.getElementById('wordInput');
    const preview = document.getElementById('colorPreview');
    const output = document.getElementById('hexOutput');
    const copyBtn = document.getElementById('copyBtn');
    const note = document.getElementById('note');

    // crypto.subtle gibt es nur in sicheren Kontexten (HTTPS oder localhost)
    const cryptoAvailable = !!(window.crypto && window.crypto.subtle);
    if (!cryptoAvailable) {
        note.textContent = 'Nicht verfügbar: Die Seite muss über HTTPS oder localhost geöffnet werden.';
        input.disabled = true;
    }

    // Zähler, damit ein älteres Ergebnis kein neueres überschreibt
    let requestId = 0;

    input.addEventListener('input', async (e) => {
        const myId = ++requestId;
        const hexColor = await textToHexColor(e.target.value);
        if (myId !== requestId) return;
        preview.style.backgroundColor = hexColor;
        output.textContent = hexColor;
    });

    copyBtn.addEventListener('click', async () => {
        const originalText = copyBtn.textContent;
        let label;
        try {
            await navigator.clipboard.writeText(output.textContent);
            label = 'Kopiert!';
        } catch (err) {
            label = 'Fehlgeschlagen';
        }
        copyBtn.textContent = label;
        setTimeout(() => { copyBtn.textContent = originalText; }, 1500);
    });
</script>

</body>
</html>
